<!doctype html><html><head><meta charset="utf-8"><title>Blockchain E Voting</title>
<style>
body{font-family:system-ui;max-width:480px;margin:32px auto;padding:0 16px}
input{padding:7px;margin:3px 0;width:100%;box-sizing:border-box}
button{padding:8px 14px;margin:4px 4px 4px 0;cursor:pointer}
fieldset{border:1px solid #ccc;border-radius:8px;margin:14px 0}
.c{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:6px;padding:8px 12px;margin:6px 0}
#s{color:#666;font-size:14px;min-height:18px}
small{color:#888}
</style></head><body>
<h2>🗳️ Blockchain Voting Rooms</h2>
<p id="s">Connect your wallet to start.</p>
<button id="conn" onclick="connect()">Connect MetaMask</button>
<div id="app" style="display:none">
  <fieldset><legend>Create an election</legend>
    <input id="ctitle" placeholder="Election title">
    <input id="cpw" placeholder="Room password">
    <button onclick="createE()">Create room</button>
    <div><small>You become the creator and can add candidates / stop it.</small></div>
  </fieldset>
  <fieldset><legend>Open a room</legend>
    <input id="rid" placeholder="Room ID (number)">
    <input id="rpw" placeholder="Room password">
    <button onclick="openE()">Open</button>
  </fieldset>
  <fieldset><legend>All elections <button onclick="listAll()">&#8635;</button></legend>
    <div id="all"><small>&mdash;</small></div>
  </fieldset>
  <div id="room"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script>
const ADDR="0xD33feaeed385B3AE5932C3a50f41FC3d3FA311Ec";
const ABI=["function electionCount() view returns (uint)","function createElection(string title,string password) returns (uint)","function addCandidate(uint id,string name)","function vote(uint id,uint cand,string password)","function stopElection(uint id)","function getInfo(uint id) view returns (string title,address creator,bool active,uint candidateCount)","function getCandidate(uint id,uint i) view returns (string name,uint votes)","function hasVoted(uint id,address who) view returns (bool)","event ElectionCreated(uint indexed id,address indexed creator,string title)"];
let signer,me,C,room;
const S=t=>document.getElementById("s").textContent=t;
async function connect(){
  if(!window.ethereum)return alert("Install MetaMask");
  let p=new ethers.BrowserProvider(window.ethereum);
  await p.send("eth_requestAccounts",[]);
  if((await p.getNetwork()).chainId!==11155111n){
    try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0xaa36a7"}]});}
    catch{return alert("Approve the switch to the Sepolia network in MetaMask, then click Connect again.");}
    p=new ethers.BrowserProvider(window.ethereum);
  }
  signer=await p.getSigner(); me=(await signer.getAddress()).toLowerCase();
  C=new ethers.Contract(ADDR,ABI,signer);
  document.getElementById("conn").style.display="none";
  document.getElementById("app").style.display="block";
  S("Connected: "+me); listAll();
}
async function listAll(){
  const n=Number(await C.electionCount());
  let h=n?"":"<small>No elections yet — create one above.</small>";
  for(let i=1;i<=n;i++){const f=await C.getInfo(i);
    h+=`<div class="c"><span>#${i} · ${f[0]} · ${f[2]?"LIVE":"ENDED"}</span><button onclick="pick(${i})">Use ID</button></div>`;}
  document.getElementById("all").innerHTML=h;
}
function pick(i){rid.value=i;rpw.focus();}
async function createE(){
  try{
    S("Creating room…");
    const tx=await C.createElection(ctitle.value,cpw.value);
    const r=await tx.wait();
    const ev=r.logs.map(l=>{try{return C.interface.parseLog(l)}catch{}}).find(x=>x&&x.name==="ElectionCreated");
    S("Room created! Share Room ID = "+ev.args.id+" and the password with voters."); listAll();
  }catch(e){S(e.reason||e.message)}
}
async function openE(){
  try{
    const id=BigInt(rid.value), pw=rpw.value;
    const info=await C.getInfo(id);
    room={id,pw,creator:info[1].toLowerCase(),active:info[2]};
    await render(info);
  }catch(e){S(e.reason||e.message)}
}
async function render(info){
  const n=Number(info[3]), mine=room.creator===me, voted=await C.hasVoted(room.id,me);
  let h=`<fieldset><legend>${info[0]} (Room ${room.id})</legend>`+
    `<small>Creator: ${room.creator}${mine?" (you)":""} · ${room.active?"LIVE":"ENDED"}${voted?" · you voted":""}</small>`;
  for(let i=0;i<n;i++){const c=await C.getCandidate(room.id,i);
    h+=`<div class="c"><span>${c[0]} — <b>${c[1]}</b></span>`+
      (room.active&&!voted?`<button onclick="castV(${i})">Vote</button>`:"")+`</div>`;}
  if(mine&&room.active)h+=`<input id="newc" placeholder="New candidate name"><button onclick="addC()">Add candidate</button><button onclick="stopE()">Stop election</button>`;
  document.getElementById("room").innerHTML=h+`</fieldset>`;
}
async function refresh(){await render(await C.getInfo(room.id));}
async function castV(i){try{S("Submitting vote…");await(await C.vote(room.id,i,room.pw)).wait();S("Voted!");refresh();}catch(e){S(e.reason||e.message)}}
async function addC(){try{S("Adding candidate…");await(await C.addCandidate(room.id,newc.value)).wait();S("Added.");refresh();}catch(e){S(e.reason||e.message)}}
async function stopE(){try{S("Stopping…");await(await C.stopElection(room.id)).wait();room.active=false;S("Election stopped.");refresh();}catch(e){S(e.reason||e.message)}}
</script></body></html>
